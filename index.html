<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Clock</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b0b0f;
    color: white;
    text-align: center;
}

.big-time {
    font-size: 3rem;
    margin-top: 40px;
}

.search-box {
    margin-top: 20px;
    padding: 10px;
    width: 250px;
}

.suggestions {
    background: #111;
    max-width: 250px;
    margin: auto;
    text-align: left;
}

.suggestions div {
    padding: 8px;
    cursor: pointer;
}

.suggestions div:hover {
    background: #222;
}
</style>
</head>

<body>

<h2 id="location">Local Time</h2>
<div id="clock" class="big-time">00:00:00</div>

<input id="city-search" class="search-box" placeholder="Loading data..." disabled>
<div id="suggestions" class="suggestions"></div>

<script>
let flatCities = [];
let activeTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
let activeName = "Local Time";

// CLOCK
function updateClock() {
    const now = new Date();
    const time = now.toLocaleTimeString("en-GB", {
        timeZone: activeTz
    });

    document.getElementById("clock").textContent = time;
    document.getElementById("location").textContent = activeName;
}

setInterval(updateClock, 1000);

// LOAD DATA
async function initData() {
    const input = document.getElementById("city-search");

    try {
        const res = await fetch("https://raw.githubusercontent.com/dr5hn/countries-states-cities-database/master/json/countries+states+cities.json");
        const data = await res.json();

        data.forEach(country => {
            country.states.forEach(state => {
                state.cities.forEach(city => {
                    if (country.timezones && country.timezones.length > 0) {
                        flatCities.push({
                            name: city.name,
                            state: state.name,
                            country: country.name,
                            tz: country.timezones[0].zoneName
                        });
                    }
                });
            });
        });

        input.placeholder = "Search city...";
        input.disabled = false;

        console.log("Loaded cities:", flatCities.length);

    } catch (err) {
        input.placeholder = "Failed to load data";
        console.error(err);
    }
}

// SEARCH
const input = document.getElementById("city-search");
const suggestions = document.getElementById("suggestions");

input.addEventListener("input", () => {
    const val = input.value.toLowerCase().trim();
    suggestions.innerHTML = "";

    if (val.length < 2) {
        return;
    }

    const matches = flatCities
        .filter(c => c.name.toLowerCase().includes(val))
        .slice(0, 5);

    matches.forEach(m => {
        const div = document.createElement("div");
        div.textContent = `${m.name}, ${m.state}`;
        div.onclick = () => {
            activeTz = m.tz;
            activeName = m.name;
            input.value = "";
            suggestions.innerHTML = "";
        };
        suggestions.appendChild(div);
    });
});

// INIT
initData();
</script>

</body>
</html>
