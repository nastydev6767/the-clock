<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Clock</title>
    <style>
        :root { --bg: #050505; --panel: #121214; --accent: #34d399; --text: #e2e8f0; --secondary: #64748b; }
        body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding-top: 50px; }
        .container { width: 90%; max-width: 450px; background: var(--panel); padding: 2.5rem; border-radius: 35px; border: 1px solid #222; text-align: center; }
        .brand { font-size: 1.2rem; letter-spacing: 6px; text-transform: uppercase; color: var(--accent); margin-bottom: 30px; }
        input { width: 100%; padding: 18px; border-radius: 18px; border: 1px solid #333; background: #1a1a1c; color: white; outline: none; box-sizing: border-box; }
        .suggestions { background: #1a1a1c; border: 1px solid #333; border-radius: 15px; max-height: 300px; overflow-y: auto; margin-top: 10px; display: none; text-align: left; }
        .suggestions div { padding: 14px 20px; cursor: pointer; border-bottom: 1px solid #222; display: flex; flex-direction: column; }
        .suggestions div:hover { background: #252529; }
        #clock { font-size: 5rem; font-weight: 900; margin: 10px 0; font-variant-numeric: tabular-nums; }
        #location { color: var(--accent); font-weight: 500; }
    </style>
</head>
<body>
<div class="container">
    <div class="brand">The Clock</div>
    <input type="text" id="search" placeholder="Connecting to Global Database..." disabled>
    <div id="suggestions" class="suggestions"></div>
    <div id="location">Detecting...</div>
    <div id="clock">00:00:00</div>
    <div id="date">---</div>
</div>

<script>
    let flatCities = [];
    let activeTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    let activeName = "Local Time";

    async function loadData() {
        const input = document.getElementById('search');
        try {
            // Pulling directly from dr5hn's cloud database
            const res = await fetch('https://raw.githubusercontent.com/dr5hn/countries-states-cities-database/master/json/countries+states+cities.json');
            const data = await res.json();
            
            data.forEach(country => {
                country.states.forEach(state => {
                    state.cities.forEach(city => {
                        flatCities.push({
                            cityName: city.name,
                            stateName: state.name,
                            countryName: country.name,
                            tz: city.timezone || (country.timezones && country.timezones.zoneName) || "UTC"
                        });
                    });
                });
            });
            input.placeholder = "Search (Goa, Haryana, Kurukshetra...)";
            input.disabled = false;
        } catch (err) { input.placeholder = "Load Error"; }
    }

    const input = document.getElementById('search');
    const sugg = document.getElementById('suggestions');

    input.addEventListener('input', () => {
        const val = input.value.toLowerCase().trim();
        sugg.innerHTML = '';
        if (val.length < 2) { sugg.style.display = 'none'; return; }
        const matches = flatCities.filter(c => 
            c.cityName.toLowerCase().includes(val) || c.stateName.toLowerCase().includes(val)
        ).slice(0, 20);
        if (matches.length > 0) {
            sugg.style.display = 'block';
            matches.forEach(m => {
                const div = document.createElement('div');
                div.innerHTML = `<strong>${m.cityName}</strong><small>${m.stateName}, ${m.countryName}</small>`;
                div.onclick = () => {
                    activeTz = m.tz; activeName = m.cityName;
                    input.value = ''; sugg.style.display = 'none';
                };
                sugg.append(div);
            });
        }
    });

    function tick() {
        const now = new Date();
        const tOpt = { timeZone: activeTz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
        const dOpt = { timeZone: activeTz, weekday: 'long', day: 'numeric', month: 'long' };
        document.getElementById('clock').textContent = new Intl.DateTimeFormat('en-GB', tOpt).format(now);
        document.getElementById('date').textContent = new Intl.DateTimeFormat('en-GB', dOpt).format(now);
        document.getElementById('location').textContent = activeName;
    }
    setInterval(tick, 1000);
    loadData();
</script>
</body>
</html>
