<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Clock | PC Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050507;
            --panel: rgba(255, 255, 255, 0.04);
            --accent: #00ffa3;
            --text: #ffffff;
            --secondary: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --danger: #ff4757;
        }

        * { box-sizing: border-box; outline: none; }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* TOP NAVIGATION BAR (PC Style) */
        nav {
            background: rgba(10, 10, 12, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 20px 0;
            z-index: 1000;
        }

        nav button {
            background: none; border: none; color: var(--secondary);
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; transition: 0.3s; font-weight: 500;
        }

        nav button.active { color: var(--accent); font-weight: 800; border-bottom: 2px solid var(--accent); padding-bottom: 5px; }

        /* MAIN CONTENT AREA */
        .tab-content {
            flex: 1;
            display: none;
            padding: 60px 40px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .active-tab { display: flex !important; }

        .brand { font-size: 0.8rem; letter-spacing: 5px; color: var(--accent); margin-bottom: 15px; opacity: 0.6; }
        .big-time { font-size: 6rem; font-weight: 800; margin: 10px 0; font-variant-numeric: tabular-nums; line-height: 1; }

        /* SEARCH UI (CLOCK TAB) */
        .search-wrapper { width: 100%; max-width: 400px; position: relative; margin-top: 30px; }
        .search-box {
            width: 100%; padding: 18px; border-radius: 15px; border: 1px solid var(--border);
            background: var(--panel); color: white; font-size: 1rem; text-align: center;
        }

        .suggestions {
            position: absolute; top: 70px; left: 0; right: 0; 
            background: #111113; border-radius: 15px; max-height: 250px; 
            overflow-y: auto; border: 1px solid var(--border);
            display: none; z-index: 1100;
        }
        .suggestions div { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); cursor: pointer; }
        .suggestions strong { display: block; color: var(--accent); }
        .suggestions small { color: var(--secondary); }

        /* ALARM DASHBOARD (PC SPLIT VIEW) */
        .alarm-dashboard { display: flex; gap: 40px; width: 100%; max-width: 1000px; height: 500px; }
        .alarm-creator { flex: 1; background: var(--panel); border-radius: 30px; padding: 40px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; }
        .alarm-list-view { flex: 1.2; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }

        .time-input-group { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .time-input-group input, .time-input-group select {
            background: #000; border: 1px solid var(--border); color: white;
            font-size: 2.5rem; font-weight: 800; padding: 15px; border-radius: 15px; width: 100px; text-align: center;
        }

        .day-selector { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .day-btn { background: var(--panel); border: 1px solid var(--border); color: var(--secondary); padding: 10px; border-radius: 10px; cursor: pointer; font-size: 0.8rem; min-width: 45px; }
        .day-btn.active { background: var(--accent); color: black; border: none; }

        .alarm-card { background: var(--panel); padding: 25px; border-radius: 20px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

        /* BUTTONS */
        .btn { padding: 18px 40px; border-radius: 50px; border: 1px solid var(--border); background: var(--panel); color: white; cursor: pointer; font-weight: 700; transition: 0.2s; }
        .btn-main { background: var(--accent); color: black; border: none; }
        .btn-danger { background: var(--danger); color: white; border: none; }

        /* ALARM OVERLAY */
        #alarm-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 71, 87, 0.4); backdrop-filter: blur(10px);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;
        }
    </style>
</head>
<body>

    <audio id="alarm-sound" src="alarm.mp3" loop></audio>

    <div id="alarm-overlay">
        <h1 style="font-size: 5rem; color: white;">ALARM RINGING!</h1>
        <button class="btn btn-main" onclick="stopAlarm()">Dismiss Alarm</button>
    </div>

    <nav>
        <button id="n-clock" class="active" onclick="showTab('clock')">World Clock</button>
        <button id="n-stopwatch" onclick="showTab('stopwatch')">Stopwatch</button>
        <button id="n-timer" onclick="showTab('timer')">Timer</button>
        <button id="n-alarm" onclick="showTab('alarm')">Alarms</button>
    </nav>

    <div id="clock-tab" class="tab-content active-tab">
        <div class="brand">DASHBOARD</div>
        <div id="location" style="color: var(--accent); font-size: 1.2rem;">Local Time</div>
        <div id="main-clock" class="big-time">00:00:00</div>
        <div id="main-date" style="color: var(--secondary); letter-spacing: 3px;">MONDAY, 27 APRIL</div>
        
        <div class="search-wrapper">
            <div id="suggestions" class="suggestions"></div>
            <input type="text" id="city-search" class="search-box" placeholder="Loading Global Data..." disabled autocomplete="off">
        </div>
    </div>

    <div id="stopwatch-tab" class="tab-content">
        <div class="brand">PRECISION</div>
        <div id="sw-display" class="big-time">00:00.00</div>
        <div style="display: flex; gap: 20px; margin-top: 20px;">
            <button class="btn" onclick="resetSW()">Reset</button>
            <button class="btn btn-main" id="sw-btn" onclick="toggleSW()">Start</button>
        </div>
    </div>

    <div id="timer-tab" class="tab-content">
        <div class="brand">COUNTDOWN</div>
        <div id="timer-display" class="big-time">00:00</div>
        <div id="t-inputs" class="time-input-group">
            <input type="number" id="t-min" placeholder="MM">
            <input type="number" id="t-sec" placeholder="SS">
        </div>
        <button class="btn btn-main" id="timer-btn" onclick="toggleTimer()">Start Timer</button>
    </div>

    <div id="alarm-tab" class="tab-content">
        <div class="brand">SCHEDULE</div>
        <div class="alarm-dashboard">
            <div class="alarm-creator">
                <div class="time-input-group">
                    <input type="number" id="a-hr" value="07" max="12" min="1">
                    <span>:</span>
                    <input type="number" id="a-min" value="00" max="59" min="0">
                    <select id="a-ampm"><option>AM</option><option>PM</option></select>
                </div>
                <div class="day-selector">
                    <button class="day-btn" onclick="this.classList.toggle('active')">M</button>
                    <button class="day-btn" onclick="this.classList.toggle('active')">T</button>
                    <button class="day-btn" onclick="this.classList.toggle('active')">W</button>
                    <button class="day-btn" onclick="this.classList.toggle('active')">T</button>
                    <button class="day-btn" onclick="this.classList.toggle('active')">F</button>
                    <button class="day-btn" onclick="this.classList.toggle('active')">S</button>
                    <button class="day-btn" onclick="this.classList.toggle('active')">S</button>
                </div>
                <button class="btn btn-main" onclick="addAlarm()">Save Alarm</button>
            </div>
            <div id="alarm-list-pc" class="alarm-list-view"></div>
        </div>
    </div>

    <script>
        let flatCities = [], tz = Intl.DateTimeFormat().resolvedOptions().timeZone, locName = "Local Time";
        let swStart, swInterval, swElapsed = 0;
        let timerInt, timeLeft = 0;
        let alarms = [];
        const alarmSound = document.getElementById('alarm-sound');

        // Navigation & Audio Unlock
        function showTab(t) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active-tab'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            document.getElementById(t + '-tab').classList.add('active-tab');
            document.getElementById('n-' + t).classList.add('active');
            // Unlock Audio
            alarmSound.play().then(() => { alarmSound.pause(); alarmSound.currentTime = 0; }).catch(()=>{});
        }

        // 1. WORLD CLOCK DATA
        async function initData() {
            const input = document.getElementById('city-search');
            try {
                const res = await fetch('https://raw.githubusercontent.com/dr5hn/countries-states-cities-database/master/json/countries+states+cities.json');
                const data = await res.json();
                data.forEach(country => {
                    country.states.forEach(state => {
                        state.cities.forEach(city => {
                            flatCities.push({ n: city.name, s: state.name, c: country.name, z: city.timezone || country.timezones.zoneName });
                        });
                    });
                });
                input.placeholder = "Search (City, State...)";
                input.disabled = false;
            } catch (e) { input.placeholder = "Offline Mode"; }
        }

        document.getElementById('city-search').addEventListener('input', e => {
            const val = e.target.value.toLowerCase();
            const sugg = document.getElementById('suggestions');
            sugg.innerHTML = '';
            if (val.length < 2) { sugg.style.display = 'none'; return; }
            const matches = flatCities.filter(c => c.n.toLowerCase().includes(val) || c.s.toLowerCase().includes(val)).slice(0, 10);
            if (matches.length > 0) {
                sugg.style.display = 'block';
                matches.forEach(m => {
                    const d = document.createElement('div');
                    d.innerHTML = `<strong>${m.n}</strong><small>${m.s}, ${m.c}</small>`;
                    d.onclick = () => { tz = m.z; locName = m.n; sugg.style.display = 'none'; e.target.value = ''; };
                    sugg.append(d);
                });
            }
        });

        function updateClock() {
            const now = new Date();
            const opt = { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('main-clock').textContent = new Intl.DateTimeFormat('en-GB', opt).format(now);
            document.getElementById('location').textContent = locName;
            document.getElementById('main-date').textContent = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
            
            // Alarm Checker
            const checkTime = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit' }).replace(/^0/, '');
            alarms.forEach(a => { if(a.time === checkTime && a.active) triggerAlarm(); });
        }
        setInterval(updateClock, 1000);

        // 2. STOPWATCH
        function toggleSW() {
            const btn = document.getElementById('sw-btn');
            if (btn.textContent === "Start") {
                swStart = Date.now() - swElapsed;
                swInterval = setInterval(() => {
                    swElapsed = Date.now() - swStart;
                    const ms = Math.floor((swElapsed % 1000) / 10), s = Math.floor((swElapsed / 1000) % 60), m = Math.floor(swElapsed / 60000);
                    document.getElementById('sw-display').textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${ms.toString().padStart(2,'0')}`;
                }, 10);
                btn.textContent = "Stop"; btn.className = "btn btn-danger";
            } else { clearInterval(swInterval); btn.textContent = "Start"; btn.className = "btn btn-main"; }
        }
        function resetSW() { clearInterval(swInterval); swElapsed = 0; document.getElementById('sw-display').textContent = "00:00.00"; }

        // 3. TIMER
        function toggleTimer() {
            const btn = document.getElementById('timer-btn');
            if (btn.textContent === "Start Timer") {
                const m = parseInt(document.getElementById('t-min').value) || 0, s = parseInt(document.getElementById('t-sec').value) || 0;
                timeLeft = (m * 60) + s;
                if (timeLeft <= 0) return;
                document.getElementById('t-inputs').style.display = 'none';
                timerInt = setInterval(() => {
                    timeLeft--;
                    const min = Math.floor(timeLeft / 60), sec = timeLeft % 60;
                    document.getElementById('timer-display').textContent = `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
                    if (timeLeft <= 0) { clearInterval(timerInt); triggerAlarm(); resetTimerUI(); }
                }, 1000);
                btn.textContent = "Cancel"; btn.className = "btn btn-danger";
            } else { clearInterval(timerInt); resetTimerUI(); }
        }
        function resetTimerUI() {
            document.getElementById('t-inputs').style.display = 'flex';
            document.getElementById('timer-display').textContent = "00:00";
            document.getElementById('timer-btn').textContent = "Start Timer";
            document.getElementById('timer-btn').className = "btn btn-main";
        }

        // 4. ALARM LOGIC
        function addAlarm() {
            const hr = document.getElementById('a-hr').value, min = document.getElementById('a-min').value, ampm = document.getElementById('a-ampm').value;
            const timeStr = `${hr}:${min.padStart(2,'0')} ${ampm}`;
            const alarm = { id: Date.now(), time: timeStr, active: true };
            alarms.push(alarm);
            renderAlarms();
        }

        function renderAlarms() {
            const list = document.getElementById('alarm-list-pc');
            list.innerHTML = '';
            alarms.forEach(a => {
                const card = document.createElement('div');
                card.className = 'alarm-card';
                card.innerHTML = `<div><div style="font-size:1.5rem; font-weight:800;">${a.time}</div><small style="color:var(--secondary)">Daily</small></div>
                <button class="btn" style="background:none; color:var(--danger); border:none; font-size:1.5rem;" onclick="removeAlarm(${a.id})">×</button>`;
                list.prepend(card);
            });
        }
        function removeAlarm(id) { alarms = alarms.filter(a => a.id !== id); renderAlarms(); }
        function triggerAlarm() { alarmSound.play(); document.getElementById('alarm-overlay').style.display = 'flex'; }
        function stopAlarm() { alarmSound.pause(); alarmSound.currentTime = 0; document.getElementById('alarm-overlay').style.display = 'none'; }

        initData();
    </script>
</body>
</html>
